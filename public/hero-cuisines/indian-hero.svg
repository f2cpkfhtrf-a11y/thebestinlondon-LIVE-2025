<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-indian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A202C;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A202C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-indian" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D69E2E;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#F6AD55;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D69E2E;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow-indian">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-indian)"/>
  
  <!-- Accent overlay -->
  <rect width="1920" height="200" y="440" fill="url(#accent-indian)" opacity="0.3"/>
  
  <!-- Main title -->
  <text x="960" y="420" font-family="Georgia, serif" font-size="84" font-weight="700" 
        fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" 
        filter="url(#glow-indian)">Indian</text>
  
  <!-- Subtitle -->
  <text x="960" y="520" font-family="Arial, sans-serif" font-size="32" font-weight="500" 
        fill="#D4AF37" text-anchor="middle" dominant-baseline="middle">Cuisine Hero</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="200" r="80" fill="#D69E2E" opacity="0.1"/>
  <circle cx="1720" cy="880" r="120" fill="#F6AD55" opacity="0.1"/>
  <circle cx="400" cy="800" r="60" fill="#D69E2E" opacity="0.15"/>
  <circle cx="1520" cy="300" r="90" fill="#F6AD55" opacity="0.1"/>
  
  <!-- Bottom accent line -->
  <rect x="0" y="1070" width="1920" height="10" fill="url(#accent-indian)" opacity="0.6"/>
</svg>