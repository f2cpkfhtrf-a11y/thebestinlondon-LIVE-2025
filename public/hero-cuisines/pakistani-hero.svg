<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-pakistani" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A202C;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay-pakistani" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#000000;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-pakistani)" />
  
  <!-- Pakistani Food Icons -->
  <g opacity="0.1">
    <!-- Biryani Pot -->
    <ellipse cx="300" cy="200" rx="80" ry="40" fill="#D4AF37" />
    <rect x="220" y="200" width="160" height="100" fill="#8B4513" />
    <rect x="240" y="220" width="120" height="60" fill="#D4AF37" />
    
    <!-- Karahi -->
    <circle cx="600" cy="300" r="60" fill="#D4AF37" />
    <rect x="540" y="300" width="120" height="80" fill="#8B4513" />
    
    <!-- Naan -->
    <ellipse cx="800" cy="150" rx="100" ry="30" fill="#D4AF37" />
    <ellipse cx="800" cy="150" rx="80" ry="20" fill="#F4A460" />
    
    <!-- Halwa Puri -->
    <circle cx="1000" cy="250" r="40" fill="#D4AF37" />
    <rect x="960" y="250" width="80" height="60" fill="#8B4513" />
    
    <!-- Spices -->
    <circle cx="1200" cy="180" r="25" fill="#8B4513" />
    <circle cx="1250" cy="200" r="20" fill="#D4AF37" />
    <circle cx="1300" cy="190" r="22" fill="#8B4513" />
  </g>
  
  <!-- Overlay -->
  <rect width="1920" height="1080" fill="url(#overlay-pakistani)" />
  
  <!-- Pakistani Pattern -->
  <g opacity="0.05">
    <path d="M0,0 L1920,0 L1920,1080 L0,1080 Z" fill="none" stroke="#D4AF37" stroke-width="2" />
    <path d="M0,540 L1920,540" stroke="#D4AF37" stroke-width="1" />
    <path d="M960,0 L960,1080" stroke="#D4AF37" stroke-width="1" />
  </g>
  
  <!-- Pakistani Text Elements -->
  <text x="960" y="400" text-anchor="middle" font-family="serif" font-size="120" font-weight="bold" fill="#D4AF37" opacity="0.8">
    Pakistani Cuisine
  </text>
  
  <text x="960" y="500" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#F7FAFC" opacity="0.9">
    Authentic flavors from the subcontinent
  </text>
  
  <!-- Decorative Elements -->
  <g opacity="0.3">
    <circle cx="200" cy="800" r="3" fill="#D4AF37" />
    <circle cx="250" cy="820" r="2" fill="#D4AF37" />
    <circle cx="300" cy="810" r="3" fill="#D4AF37" />
    <circle cx="350" cy="830" r="2" fill="#D4AF37" />
    <circle cx="400" cy="815" r="3" fill="#D4AF37" />
  </g>
  
  <g opacity="0.3">
    <circle cx="1520" cy="800" r="3" fill="#D4AF37" />
    <circle cx="1570" cy="820" r="2" fill="#D4AF37" />
    <circle cx="1620" cy="810" r="3" fill="#D4AF37" />
    <circle cx="1670" cy="830" r="2" fill="#D4AF37" />
    <circle cx="1720" cy="815" r="3" fill="#D4AF37" />
  </g>
</svg>
