name: Nightly Audits

on:
  schedule:
    - cron: '0 3 * * *'  # Run at 3:00 AM UTC daily
  workflow_dispatch:  # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run image audit
      run: npm run audit:images
      continue-on-error: true
      
    - name: Run link audit
      run: npm run audit:links
      continue-on-error: true
      
    - name: Run schema audit
      run: npm run audit:schema
      continue-on-error: true
      
    - name: Generate audit rollup
      run: npm run audit:all
      continue-on-error: true
      
    - name: Upload audit reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: audit-reports-${{ github.run_number }}
        path: reports/
        retention-days: 30
        
    - name: Comment on latest commit (if on main)
      if: github.ref == 'refs/heads/main' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let comment = '## 🔍 Nightly Audit Results\n\n';
          
          try {
            if (fs.existsSync('reports/rollup.json')) {
              const rollup = JSON.parse(fs.readFileSync('reports/rollup.json', 'utf8'));
              comment += `**Overall Health:** ${rollup.summary.overallHealth.toUpperCase()}\n`;
              comment += `**Issues:** ${rollup.summary.totalIssues}\n`;
              comment += `**Warnings:** ${rollup.summary.totalWarnings}\n\n`;
              
              if (rollup.recommendations.length > 0) {
                comment += '**Recommendations:**\n';
                rollup.recommendations.forEach(rec => {
                  comment += `- ${rec}\n`;
                });
              }
            } else {
              comment += '⚠️ Audit rollup not found\n';
            }
          } catch (error) {
            comment += `❌ Error reading audit results: ${error.message}\n`;
          }
          
          comment += `\n📊 [View full audit reports](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
          
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: comment
          });



