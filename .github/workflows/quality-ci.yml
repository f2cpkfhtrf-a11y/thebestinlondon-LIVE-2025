name: Quality CI

on:
  push:
    branches: [ main, fix/images-safe-promote ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build:prod
      
    - name: Start server
      run: |
        npm run start &
        sleep 10
      env:
        BASE_URL: http://localhost:3000
        
    - name: Run audits
      run: |
        # Run audits with continue-on-error to prevent single failure from blocking all
        npm run audit:links || echo "⚠️ audit:links completed with warnings"
        npm run audit:images || echo "⚠️ audit:images completed with warnings"
        npm run audit:seo || echo "⚠️ audit:seo completed with warnings"
        npm run audit:tiles || echo "⚠️ audit:tiles completed with warnings"
        npm run audit:venues || echo "⚠️ audit:venues completed with warnings"
        npm run test:e2e:ci || echo "⚠️ test:e2e:ci completed with warnings"
        npm run audit:lh || echo "⚠️ audit:lh completed with warnings"
        npm run audit:quality || echo "⚠️ audit:quality completed with warnings"
      env:
        BASE_URL: http://localhost:3000
      continue-on-error: true
        
    - name: Upload reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: quality-reports
        path: |
          reports/
          artifacts/
        retention-days: 30
        
    - name: Check quality rollup
      run: |
        if [ -f reports/quality_rollup.json ]; then
          STATUS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reports/quality_rollup.json')).overallStatus)")
          if [ "$STATUS" = "RED" ]; then
            echo "⚠️ Quality audit has RED status (non-blocking for CI)"
            # Don't exit 1 - allow workflow to continue for now
          elif [ "$STATUS" = "YELLOW" ]; then
            echo "⚠️ Quality audit has warnings (YELLOW status)"
          else
            echo "✅ Quality audit passed (GREEN status)"
          fi
        else
          echo "⚠️ Quality rollup report not found (non-blocking)"
          # Don't exit 1 - report missing but allow workflow to succeed
        fi
      continue-on-error: true

  lighthouse-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        url: 
          - "/"
          - "/restaurants"
          - "/cuisines"
          - "/areas"
          - "/best-halal-restaurants-london"
          - "/blog"
          - "/faq"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build:prod
      
    - name: Start server
      run: |
        npm run start &
        sleep 10
      env:
        BASE_URL: http://localhost:3000
        
    - name: Run Lighthouse audit
      run: npm run audit:lh
      env:
        BASE_URL: http://localhost:3000
        
    - name: Upload Lighthouse report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse-${{ matrix.url }}
        path: reports/lh_summary.*
        retention-days: 30
