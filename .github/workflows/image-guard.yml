name: image-guard
on: 
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set environment variables
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "IMAGE_PIPELINE_MODE=local-only" >> $GITHUB_ENV
      - name: Generate LQIP (non-blocking)
        run: |
          npm run images:lqip || echo "⚠️ LQIP generation skipped/failed"
      - name: Run comprehensive audit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run audit:images:fix -- --check-only
            npm run audit:tiles
            npm run audit:routes
            npm run audit:links
          else
            npm run audit:all
            npm run audit:complete
          fi
      - name: Run dietary and stats consistency tests
        run: |
          npm run audit:dietary
          npm run test:stats || echo "⚠️ Stats test skipped (requires running server)"
      - name: Run build
        run: npm run build
      - name: Run E2E smoke tests
        run: |
          npm run start &
          sleep 10
          npm run test:e2e || echo "⚠️ E2E tests failed"
          pkill -f "next start" || true
      - name: Run fact checks
        run: |
          npm run start &
          sleep 10
          npm run test:facts || echo "⚠️ Fact checks failed"
          pkill -f "next start" || true
      - name: Block external URLs in source code
        run: |
          # Check for external image URLs in source code (case-insensitive)
          if grep -r -i -E 'http://|https://|unsplash|googleusercontent|cloudfront|gstatic' --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' pages/ components/ lib/ || \
             grep -r -i -E 'http://|https://|unsplash|googleusercontent|cloudfront|gstatic' public/venues.json; then
            echo "❌ External URLs detected in source code"
            exit 1
          else
            echo "✅ No external URLs found"
          fi
      - name: Check small images
        run: |
          find public/images/restaurants -type f -name '*.webp' -size -50k -print -quit | \
          (! read) || (echo "❌ Found .webp under 50KB" && exit 1)
      - name: Upload test reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
          retention-days: 7
