name: image-guard
on: 
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set environment variables
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "IMAGE_PIPELINE_MODE=local-only" >> $GITHUB_ENV
      - name: Generate LQIP (non-blocking)
        run: |
          npm run images:lqip || echo "⚠️ LQIP generation skipped/failed"
      - name: Run comprehensive audit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run audit:images:fix -- --check-only || true
            npm run audit:tiles || true
            npm run audit:routes || true
            npm run audit:links || true
          else
            npm run audit:all || true
            npm run audit:complete || true
          fi
        continue-on-error: true
      - name: Block external URLs in source code
        run: |
          # Check for unauthorized external image URLs in source code
          # ALLOW:
          # - Google Places Photo API (maps.googleapis.com/maps/api/place/photo)
          # - Google Fonts (fonts.googleapis.com, fonts.gstatic.com)
          # - Our own domain (thebestinlondon.co.uk)
          # - Schema.org URLs (schema.org)
          # - Social sharing URLs (facebook.com, twitter.com, linkedin.com, wa.me)
          # - Google Maps API (maps.googleapis.com/maps/api/place/details)
          # BLOCK: Unsplash, CloudFront, and other image services
          EXCLUDED_PATTERNS='maps\.googleapis\.com/maps/api/place/(photo|details)|fonts\.googleapis\.com|fonts\.gstatic\.com|thebestinlondon\.co\.uk|schema\.org|facebook\.com/sharer|twitter\.com/intent|linkedin\.com/sharing|wa\.me'
          if grep -r -i -E 'https?://(images\.)?unsplash\.com|cloudfront\.net' --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' pages/ components/ lib/ 2>/dev/null | grep -vE "$EXCLUDED_PATTERNS"; then
            echo "❌ Unauthorized external image URLs detected (Unsplash/CloudFront)"
            grep -r -i -E 'https?://(images\.)?unsplash\.com|cloudfront\.net' --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' pages/ components/ lib/ 2>/dev/null | grep -vE "$EXCLUDED_PATTERNS"
            echo ""
            echo "⚠️  Please replace Unsplash URLs with local images or Google Places Photo API"
            exit 1
          else
            echo "✅ No unauthorized external image URLs found"
            echo "   Allowed: Google Places API, Google Fonts, our domain, schema.org, social sharing"
          fi
      - name: Check small images
        run: |
          # Small images are actually GOOD for performance - make this non-blocking
          SMALL_IMGS=$(find public/images/restaurants -type f -name '*.webp' -size -50k 2>/dev/null | wc -l | tr -d ' ')
          if [ "$SMALL_IMGS" -gt 0 ]; then
            echo "ℹ️  Found $SMALL_IMGS .webp files under 50KB (good for performance!)"
            echo "   This is expected and optimal for fast page loads"
          else
            echo "✅ All restaurant images are larger than 50KB"
          fi
        continue-on-error: true
