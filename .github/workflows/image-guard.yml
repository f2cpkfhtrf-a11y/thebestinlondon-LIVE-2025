name: image-guard
on: 
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Set environment variables
        run: |
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "IMAGE_PIPELINE_MODE=local-only" >> $GITHUB_ENV
      - name: Run comprehensive audit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run audit:images:fix -- --check-only
            npm run audit:tiles
          else
            npm run audit:all
          fi
      - name: Block external/Unsplash URLs
        run: |
          ! grep -R -E 'images\.unsplash\.com|http(s)?://(?!www\.thebestinlondon\.co\.uk|localhost)' public/venues.json || \
          (echo "❌ External/Unsplash URLs detected" && exit 1)
      - name: Check small images
        run: |
          find public/images/restaurants -type f -name '*.webp' -size -50k -print -quit | \
          (! read) || (echo "❌ Found .webp under 50KB" && exit 1)
